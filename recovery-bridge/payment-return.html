<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pago · Delivery</title>
<style>body{font-family:system-ui,sans-serif;max-width:32rem;margin:2rem auto;padding:0 1rem;color:#222}
a.btn{display:inline-block;background:#FE8C00;color:#fff;padding:.8rem 1.2rem;border-radius:2rem;text-decoration:none;font-weight:700}</style>
</head>
<body>
<h1 id="t">Gracias</h1>
<p id="m">Stripe ya procesó tu intento de pago. Regresa a la app Delivery: ahí verificamos el resultado de forma segura.</p>
<p><a class="btn" href="fastfood://orders">Abrir la app</a></p>
<p>Esta página solo informa: no guarda ni envía ningún dato y no confirma pagos. El pago se confirma únicamente en el servidor.</p>
<script>
  // Solo cambia el texto según el parámetro de la URL; no decide si el pedido está pagado.
  if (new URLSearchParams(location.search).get('result') === 'cancelled') {
    document.getElementById('t').textContent = 'Pago cancelado';
    document.getElementById('m').textContent = 'No se realizó ningún cobro. Puedes volver a la app y usar “Pagar ahora” en Mis pedidos cuando quieras.';
  }
</script>
</body>
</html>
